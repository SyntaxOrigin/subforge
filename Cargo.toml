[package]
name = "subforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "SRT, ASS ve WebVTT altyazilarini okuyan, guvenilirlik denetleyen ve toplu zaman kaydiran metin araci."
repository = "https://github.com/SyntaxOrigin/subforge"
readme = "README.md"
keywords = ["cli", "subforge", "subtitle", "srt", "vtt"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
# serde: `check`/`report` JSON semasi ile kural esik profili dosyalarinin serilestirilmesi icin
# turetilmis veri yapilari gerekli (src/rapor.rs, src/kural.rs).
serde = { version = "1", features = ["derive"] }
# serde_json: `--json` bayragiyla uretilen kanit raporu ve `--rules` ile okunan esik
# dosyasi bu crate ile yazilir/okunur (src/rapor.rs, src/cli.rs).
serde_json = "1"
# clap: check, shift, normalize, convert, report alt komutlarinin arguman ayristirmasi
# ve `--help` ciktisi bu crate ile uretilir (src/cli.rs).
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
